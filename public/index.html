<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0072CE">
  <title>ST Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.svg">
</head>
<body>
  <div class="container">
    <header>
      <h1>🚇 Sound Transit Tracker</h1>
      <p class="subtitle">Real-time arrivals for Link Light Rail</p>
    </header>
    
    <main>
      <section class="station-selector">
        <div class="line-selector">
          <button class="line-btn active" data-line="2_line" style="--line-color: #E31837">2 Line</button>
          <button class="line-btn" data-line="1_line" style="--line-color: #0072CE">1 Line</button>
        </div>
        
        <label for="station">Select Station:</label>
        <select id="station">
          <!-- Populated dynamically by app.js -->
        </select>
        
        <div id="walk-time" class="walk-time">📍 Locating...</div>
        
        <div class="direction-toggle">
          <button class="dir-btn active" data-direction="southbound"></button>
          <button class="dir-btn" data-direction="northbound"></button>
        </div>
      </section>
      
      <section class="arrivals-section">
        <h2 id="station-name">Marymoor Village</h2>
        <p id="direction-label" class="direction-label">→ Southbound to Bellevue</p>
        
        <div id="arrivals-list" class="arrivals-list">
          <div class="loading">Loading arrivals...</div>
        </div>
        
        <div class="last-updated">
          Last updated: <span id="last-updated">--</span>
          <button id="refresh-btn" class="refresh-btn">🔄 Refresh</button>
        </div>
      </section>
      
      <section class="alerts-section">
        <h3>⚠️ Service Alerts</h3>
        <div id="alerts-list" class="alerts-list">
          <div class="no-alerts">No active alerts</div>
        </div>
      </section>
      
      <section class="nfc-section">
        <button id="nfc-enable-btn" class="nfc-btn">🔖 Enable ORCA Card Scan</button>
        <p id="nfc-status" class="nfc-status"></p>
      </section>
    </main>
  </div>
  
  <!-- NFC Scan Result Modal -->
  <div id="nfc-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-icon">🚇</div>
      <h2 class="modal-title">ORCA Card Scanned!</h2>
      <p id="nfc-serial" class="modal-serial"></p>
      <p class="modal-message">Card detected successfully</p>
      <button id="modal-close-btn" class="modal-close-btn">OK</button>
    </div>
  </div>
  
  <script src="app.js?v=20260120b"></script>
</body>
</html>
