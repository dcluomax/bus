<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0072CE"/>
      <stop offset="100%" style="stop-color:#0057A0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Light Rail Icon -->
  <g transform="translate(80, 80)">
    <!-- Train body -->
    <rect x="69" y="53" width="213" height="240" rx="27" fill="white"/>
    
    <!-- Front window -->
    <rect x="96" y="80" width="160" height="93" rx="13" fill="#0072CE"/>
    
    <!-- Door windows -->
    <rect x="109" y="200" width="53" height="67" rx="8" fill="#0072CE"/>
    <rect x="189" y="200" width="53" height="67" rx="8" fill="#0072CE"/>
    
    <!-- Headlights -->
    <circle cx="109" cy="280" r="13" fill="#FFD700"/>
    <circle cx="243" cy="280" r="13" fill="#FFD700"/>
    
    <!-- Rail tracks -->
    <rect x="27" y="307" width="299" height="16" rx="5" fill="white" opacity="0.8"/>
    <rect x="53" y="288" width="11" height="27" fill="white" opacity="0.6"/>
    <rect x="133" y="288" width="11" height="27" fill="white" opacity="0.6"/>
    <rect x="213" y="288" width="11" height="27" fill="white" opacity="0.6"/>
    <rect x="288" y="288" width="11" height="27" fill="white" opacity="0.6"/>
  </g>
</svg>
